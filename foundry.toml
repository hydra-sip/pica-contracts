[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 50
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 100
fail_on_revert = true

[fmt]
line_length = 100
